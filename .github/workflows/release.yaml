name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-mm-inches
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tag: ${{ steps.image.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: tyler180
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Generate image metadata
        id: image
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: tyler180/mm-inches
          tags: type=sha,format=short,prefix=sha-

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: ${{ steps.image.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

  propose-deployment:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_BRANCH: deploy/mm-inches-${{ github.sha }}
      IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
      IMAGE_TAG: ${{ needs.publish.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
    steps:
      - name: Check out GitOps repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: tyler180/talos-gitops
          ref: main
          path: talos-gitops
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.35.0

      - name: Update deployment image
        working-directory: talos-gitops
        run: |
          sed -i -E \
            "s#image: tyler180/mm-inches(@sha256:[a-f0-9]+|:[^[:space:]]+)#image: tyler180/mm-inches@${IMAGE_DIGEST}#" \
            applications/mm-inches/deployment.yaml
          grep -F "image: tyler180/mm-inches@${IMAGE_DIGEST}" applications/mm-inches/deployment.yaml
          git diff --check
          kubectl kustomize applications/mm-inches >/tmp/mm-inches-rendered.yaml

      - name: Push deployment branch
        working-directory: talos-gitops
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -B "$DEPLOY_BRANCH"
          git add applications/mm-inches/deployment.yaml
          git commit -m "deploy mm-inches ${GITHUB_SHA::12}"
          git push --force-with-lease origin "$DEPLOY_BRANCH"

      - name: Open GitOps pull request
        working-directory: talos-gitops
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          pr_number="$(gh pr list --head "$DEPLOY_BRANCH" --state open --json number --jq '.[0].number // empty')"
          body="Source commit: ${SOURCE_SHA}

          Image: \`${IMAGE_TAG}@${IMAGE_DIGEST}\`

          Build: ${RUN_URL}"
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --title "Deploy mm-inches ${SOURCE_SHA::12}" --body "$body"
          else
            gh pr create \
              --base main \
              --head "$DEPLOY_BRANCH" \
              --title "Deploy mm-inches ${SOURCE_SHA::12}" \
              --body "$body"
          fi
